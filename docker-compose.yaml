services:

  gateway:
    build: gateway/.
    container_name: gateway
    ports:
      - "8080:8080"
    networks:
      book-app-network:
        ipv4_address: 100.0.0.2

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    ports:
      - "8500:8500"
    networks:
      book-app-network:
        ipv4_address: 100.0.0.3

  config:
    build: config/.
    container_name: config
    networks:
      book-app-network:
        ipv4_address: 100.0.0.4

  user-db:
    image: postgres:latest
    container_name: user-db
    environment:
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: administration
    networks:
      book-app-network:
        ipv4_address: 100.0.0.5

  user-service:
    build: user/.
    container_name: user-service
    networks:
      book-app-network:
    depends_on:
      - config
      - consul
      - user-db


networks:

  book-app-network:
    name: book-app-network
    driver: bridge
    ipam:
      config:
        - subnet: 100.0.0.0/24